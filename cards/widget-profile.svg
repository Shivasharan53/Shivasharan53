<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="280" height="348" viewBox="0 0 280 348" role="img" aria-label="Profile">
<title>Profile</title>
<defs>
 <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111d2a"/><stop offset="1" stop-color="#0b121c"/></linearGradient>
 <linearGradient id="wtop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39df91"/><stop offset="1" stop-color="#9a8cff"/></linearGradient>
 <linearGradient id="wglass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".025"/></linearGradient>
 <filter id="wshadow" x="-25%" y="-25%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/><feOffset dy="6" dx="1" result="o"/><feComponentTransfer in="o" result="s"><feFuncA type="linear" slope=".48"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="wglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="wgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39df91" stroke-opacity=".045" stroke-width=".8"/></pattern>
</defs>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif}</style>
<!-- Offset shadow plate: gives each panel a real raised dashboard edge. -->
<rect x="5" y="8" width="270" height="336" rx="20" fill="#050a12" stroke="#39df91" stroke-opacity=".52"/>
<rect x="0.5" y="0.5" width="279" height="347" rx="20" fill="url(#wbg)" stroke="#60758a" stroke-opacity=".72" filter="url(#wshadow)"/>
<rect x="1" y="1" width="278" height="346" rx="19" fill="url(#wglass)"/>
<rect x="1" y="1" width="278" height="346" rx="19" fill="url(#wgrid)"/>
<path d="M22 2H258" stroke="url(#wtop)" stroke-width="2.8" stroke-linecap="round" opacity=".98"/>
<path d="M4 24V324" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
<text x="22" y="31" font-size="10.5" font-weight="700" fill="#39df91" text-anchor="start" letter-spacing="1.5">PROFILE</text>
<text x="22" y="49" font-size="9.5" font-weight="400" fill="#91a5b8" text-anchor="start" letter-spacing="0">DEVELOPER IDENTITY</text>
<circle cx="140" cy="116" r="59" fill="#243b49" stroke="#39df91" stroke-width="2.5" filter="url(#wglow)"/><circle cx="140" cy="116" r="51" fill="#172638"/><defs><clipPath id="profileAvatar"><circle cx="140" cy="116" r="49"/></clipPath></defs><image x="91" y="67" width="98" height="98" href="avatar.png" xlink:href="avatar.png" preserveAspectRatio="xMidYMid slice" clip-path="url(#profileAvatar)"/><text x="140" y="199" font-size="16" font-weight="800" fill="#f4f7fb" text-anchor="middle" letter-spacing="0">Shivasharanappa</text><text x="140" y="221" font-size="8.5" font-weight="700" fill="#9a8cff" text-anchor="middle" letter-spacing="0.8">GENERATIVE AI ENGINEER INTERN</text><text x="140" y="240" font-size="10.5" font-weight="500" fill="#b8c8d6" text-anchor="middle" letter-spacing="0">Pragyan AI</text><path d="M22 258H258" stroke="#34495d"/><rect x="20" y="273" width="112" height="59" rx="11" fill="#1b2a39" stroke="#39df91" stroke-opacity=".34"/><path d="M31 274H121" stroke="#39df91" stroke-opacity=".55" stroke-width="1.5"/><text x="31" y="292" font-size="7.8" font-weight="700" fill="#91a5b8" text-anchor="start" letter-spacing="0.7">REPOSITORIES</text><text x="31" y="319" font-size="19" font-weight="800" fill="#39df91" text-anchor="start" letter-spacing="0">36</text><rect x="145" y="273" width="115" height="59" rx="11" fill="#1b2a39" stroke="#42c8d5" stroke-opacity=".34"/><path d="M156 274H249" stroke="#42c8d5" stroke-opacity=".55" stroke-width="1.5"/><text x="156" y="292" font-size="7.8" font-weight="700" fill="#91a5b8" text-anchor="start" letter-spacing="0.7">SPECIALITY</text><text x="156" y="319" font-size="19" font-weight="800" fill="#42c8d5" text-anchor="start" letter-spacing="0">GenAI</text></svg>
