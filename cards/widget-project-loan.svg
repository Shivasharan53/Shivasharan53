<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="390" height="145" viewBox="0 0 390 145" role="img" aria-label="SmartLoan India">
<title>SmartLoan India</title>
<defs>
 <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111d2a"/><stop offset="1" stop-color="#0b121c"/></linearGradient>
 <linearGradient id="wtop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3c969"/><stop offset="1" stop-color="#9a8cff"/></linearGradient>
 <linearGradient id="wglass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".025"/></linearGradient>
 <filter id="wshadow" x="-25%" y="-25%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/><feOffset dy="6" dx="1" result="o"/><feComponentTransfer in="o" result="s"><feFuncA type="linear" slope=".48"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="wglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="wgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#f3c969" stroke-opacity=".045" stroke-width=".8"/></pattern>
</defs>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif}</style>
<!-- Offset shadow plate: gives each panel a real raised dashboard edge. -->
<rect x="5" y="8" width="380" height="133" rx="20" fill="#050a12" stroke="#f3c969" stroke-opacity=".52"/>
<rect x="0.5" y="0.5" width="389" height="144" rx="20" fill="url(#wbg)" stroke="#60758a" stroke-opacity=".72" filter="url(#wshadow)"/>
<rect x="1" y="1" width="388" height="143" rx="19" fill="url(#wglass)"/>
<rect x="1" y="1" width="388" height="143" rx="19" fill="url(#wgrid)"/>
<path d="M22 2H368" stroke="url(#wtop)" stroke-width="2.8" stroke-linecap="round" opacity=".98"/>
<path d="M4 24V121" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
<text x="22" y="31" font-size="10.5" font-weight="700" fill="#f3c969" text-anchor="start" letter-spacing="1.5">SMARTLOAN INDIA</text>
<text x="22" y="49" font-size="9.5" font-weight="400" fill="#91a5b8" text-anchor="start" letter-spacing="0">PYTHON APPLICATION</text>
<rect x="18" y="66" width="354" height="58" rx="12" fill="#1b2a39" stroke="#f3c969" stroke-opacity=".35" filter="url(#wshadow)"/><path d="M30 67H360" stroke="#f3c969" stroke-opacity=".55"/><text x="32" y="91" font-size="11" font-weight="700" fill="#edf4f8" text-anchor="start" letter-spacing="0">SmartLoan India</text><text x="32" y="110" font-size="8.6" font-weight="400" fill="#91a5b8" text-anchor="start" letter-spacing="0">Loan information and EMI calculations</text><path d="M340 88h17m-7 -7l7 7 -7 7" stroke="#f3c969" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
