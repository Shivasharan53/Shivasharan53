<rect x="0.5" y="0.5" width="389" height="225" rx="20" fill="url(#wbg)" stroke="#60758a" stroke-opacity=".72" filter="url(#wshadow)"/>
<rect x="1" y="1" width="388" height="224" rx="19" fill="url(#wglass)"/>
<rect x="1" y="1" width="388" height="224" rx="19" fill="url(#wgrid)"/>
