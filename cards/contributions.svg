<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="GitHub contribution graph">
<title>GitHub contribution graph</title><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72c6ae"/><stop offset="1" stop-color="#d7a84b"/></linearGradient><style>
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
text{font-family:Arial,Helvetica,sans-serif}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style></defs>
<rect width="1000" height="230" rx="26" fill="#111b24"/>
<rect x="1" y="1" width="998" height="228" rx="24" fill="#17252b" stroke="#72c6ae" stroke-opacity=".22"/>
<text x="38" y="43" font-size="13" fill="#d7a84b" letter-spacing="2.5">CONTRIBUTION GRAPH</text>
  <text x="38" y="118" font-size="16" fill="#b9cbc5" >Your contribution history will appear after the first daily sync.</text></svg>
