name: Refresh profile cards
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch contribution history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import date, timedelta
          username = "Shivasharan53"
          end = date.today()
          start = end - timedelta(days=364)
          query = """query($login:String!,$from:DateTime!,$to:DateTime!){
            user(login:$login){
              contributionsCollection(from:$from,to:$to){
                contributionCalendar{
                  totalContributions
                  weeks{ contributionDays{ date contributionCount } }
                }
              }
            }
          }"""
          payload = {"query":query,"variables":{
            "login":username,"from":start.isoformat()+"T00:00:00Z",
            "to":end.isoformat()+"T23:59:59Z"}}
          req = urllib.request.Request(
            "https://api.github.com/graphql",
            data=json.dumps(payload).encode(),
            headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                     "Content-Type":"application/json"})
          with urllib.request.urlopen(req) as response:
            result=json.load(response)
          if result.get("errors"):
            raise SystemExit(result["errors"])
          cal=result["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days=[{"date":d["date"],"count":d["contributionCount"]}
                for w in cal["weeks"] for d in w["contributionDays"]]
          out={"as_of":end.isoformat(),"total_contributions":cal["totalContributions"],"days":days}
          os.makedirs("data",exist_ok=True)
          with open("data/contributions.json","w") as f: json.dump(out,f,indent=2)
          PY
      - name: Render SVG cards
        run: python scripts/render_cards.py
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          git diff --cached --quiet || git commit -m "chore: refresh animated profile cards"
          git push
